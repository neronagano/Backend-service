[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "log-service"
version = "0.1.0"
description = "A small service for collecting and searching application logs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "aiokafka==0.14.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "asgi-lifespan==2.1.0"]

[tool.setuptools.packages.find]
include = ["log_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
