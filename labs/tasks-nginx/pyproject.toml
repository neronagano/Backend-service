[project]
name = "tasks-nginx-lab"
version = "0.1.0"
description = "A task API and a static page served through nginx"
requires-python = ">=3.12"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0"]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
